deprecated_features:
  - >-
    When using antsibull-changelog as a library, the arguments ``use_ansible_doc`` to ``antsibull_changelog.plugins.load_plugins()``
    and ``args_use_ansible_doc`` to ``antsibull_changelog.cli.do_refresh()`` are deprecated. Runtime deprecations will be added
    in a future release; ``args_use_ansible_doc`` now has a default of ``False``, it was required before
    (https://github.com/ansible-community/antsibull-changelog/pull/239).
  - >-
    The ``--use-ansible-doc`` parameter to the ``generate`` and ``release`` subcommands is deprecated. It will be removed in a
    future version and using it will become a syntax error (https://github.com/ansible-community/antsibull-changelog/pull/239).
